name: CI/CD Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true # Automatically caches dependencies for faster runs

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name "Water-Chan" --icon "assets/waterchanicon_ico.ico" --paths=. --add-data "assets;assets" --add-data "pyproject.toml;." src/main.py
      # Note: PyInstaller outputs the artifact into 'dist/Water-Chan.exe'

    - name: Install WiX Toolset v4 via .NET CLI
      run: |
        dotnet tool install --global wix --version 4.0.6
      # This fetches the platform-independent wix tool executable

    - name: Compile MSI using WiX v4
      run: |
        wix build Package.wxs -arch x64 -ext WixToolset.UI.wixext -d BuildVersion="${{ github.ref_name }}" -o dist/WaterChanInstaller.msi
      # WiX v4 combines compiler (candle) and linker (light) into a single command

    - name: Upload PyInstaller EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: raw-executable
        path: dist/Water-Chan.exe

     # Automatically attaches the assets directly to release
    - name: Upload Assets to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Water-Chan.exe
          dist/WaterChanInstaller.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
